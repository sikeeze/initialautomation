name: Daily Automation

on:
  schedule:
    # Asia/Jakarta (UTC+7).  GitHub cron memakai UTC.
    - cron: '0 23 * * *'   # 06:00 WIB
    - cron: '0 3 * * *'    # 10:00 WIB
    - cron: '0 5 * * *'    # 12:00 WIB
    - cron: '0 8 * * *'    # 15:00 WIB
    - cron: '0 11 * * *'   # 18:00 WIB
    - cron: '0 14 * * *'   # 21:00 WIB
    - cron: '0 17 * * *'   # 00:00 WIB
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: stage tanpa commit/push'
        required: false
        default: 'false'
        type: boolean
      branch:
        description: 'Branch target (default: branch default repo)'
        required: false
        default: 'main'
      run_link_check:
        description: 'Aktifkan dead link check'
        required: false
        default: 'true'
        type: boolean
      run_stale_branch_report:
        description: 'Aktifkan laporan branch stale'
        required: false
        default: 'true'
        type: boolean
      run_format_check:
        description: 'Aktifkan pemeriksaan format'
        required: false
        default: 'true'
        type: boolean
      run_dependency_check:
        description: 'Aktifkan cek dependency'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: write  # push commit maintenance

concurrency:
  group: daily-automation-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12'
  LOG_LEVEL: INFO

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        # Author = user supaya commit tercatat di contribution graph.
        # Committer tetap bot karena push memakai GITHUB_TOKEN.
        run: |
          git config user.name "Aikhel sefriandika"
          git config user.email "147973151+sikeeze@users.noreply.github.com"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run daily maintenance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          INPUT_BRANCH: ${{ github.event.inputs.branch || 'main' }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          INPUT_RUN_LINK_CHECK: ${{ github.event.inputs.run_link_check || 'true' }}
          INPUT_RUN_STALE_BRANCH_REPORT: ${{ github.event.inputs.run_stale_branch_report || 'true' }}
          INPUT_RUN_FORMAT_CHECK: ${{ github.event.inputs.run_format_check || 'true' }}
          INPUT_RUN_DEPENDENCY_CHECK: ${{ github.event.inputs.run_dependency_check || 'true' }}
          LOG_LEVEL: ${{ env.LOG_LEVEL }}
        run: python run_daily.py
